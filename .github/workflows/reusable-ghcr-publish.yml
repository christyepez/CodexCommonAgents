name: Reusable GHCR Publish

on:
  workflow_call:
    inputs:
      image_name:
        description: GHCR package path without registry, for example christyepez/app-api
        required: true
        type: string
      context:
        description: Docker build context
        required: false
        default: .
        type: string
      dockerfile:
        description: Dockerfile path
        required: false
        default: Dockerfile
        type: string
      push_latest:
        description: Also publish latest convenience tag
        required: false
        default: false
        type: boolean
    outputs:
      digest:
        description: Published image digest
        value: ${{ jobs.publish.outputs.digest }}
      immutable_tag:
        description: Immutable SHA-based image tag
        value: ${{ jobs.publish.outputs.immutable_tag }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      immutable_tag: ${{ steps.meta.outputs.immutable_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable tag
        id: meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          image="ghcr.io/${{ inputs.image_name }}"
          immutable_tag="${image}:sha-${short_sha}"
          echo "immutable_tag=${immutable_tag}" >> "$GITHUB_OUTPUT"
          echo "IMMUTABLE_TAG=${immutable_tag}" >> "$GITHUB_ENV"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ env.IMMUTABLE_TAG }}
            ${{ inputs.push_latest && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Publication summary
        shell: bash
        run: |
          {
            echo "## GHCR publication"
            echo ""
            echo "- Image: ${{ steps.meta.outputs.immutable_tag }}"
            echo "- Digest: ${{ steps.build.outputs.digest }}"
            echo "- Source SHA: ${GITHUB_SHA}"
            echo "- Required visibility: PRIVATE"
            echo "- Visibility verification: perform package-level check before release completion"
          } >> "$GITHUB_STEP_SUMMARY"
